name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Builds only. Releases are signed, notarized and published from a Mac with ./release.sh.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build and package (universal)
        run: ./package.sh

      - name: Check the binary is universal
        run: lipo -archs build/ScreenSharingTouchBar.app/Contents/MacOS/ScreenSharingTouchBar | grep -q "x86_64 arm64"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ScreenSharingTouchBar
          path: dist/*
